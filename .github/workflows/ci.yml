name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/LICENSE"
      - "**/.gitignore"
      - "**/.gitattributes"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/LICENSE"
      - "**/.gitignore"
      - "**/.gitattributes"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # `flutter test` builds rust/ for the native-assets hook but never runs
      # its own unit tests (pairing records, backoff, syslog timestamps…).
      # rust-toolchain.toml's `minimal` profile has no rustfmt, and adding it
      # there would make every user's native-assets build download it too.
      - name: Rust format
        working-directory: rust
        run: |
          rustup component add rustfmt
          cargo fmt --check

      - name: Rust test
        working-directory: rust
        run: cargo test --lib

