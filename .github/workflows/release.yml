name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            targets: dmg
            upload-path: dist/*/*.dmg
            stable-glob: eagly-macos.*
          # Pinned (not ubuntu-latest): the runner links this image's
          # libavcodec/libavutil sonames, and the .deb declares matching
          # versioned dependencies (libavcodec60/libavutil58 — see
          # linux/packaging/deb/make_config.yaml). Bump both together.
          - os: ubuntu-24.04
            platform: linux
            targets: deb
            upload-path: dist/*/*.deb
            stable-glob: eagly-linux.*
          - os: windows-latest
            platform: windows
            targets: exe,msix
            upload-path: |
              dist/*/*.exe
              dist/*/*.msix
            stable-glob: eagly-windows*

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        shell: bash
        run: echo "FLUTTER_VERSION=$(cat .fvmrc | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"flutter\"])')" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libavcodec-dev libavutil-dev

      - name: Install macOS packaging dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p "$HOME/.local"
          npm install -g appdmg --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Windows packaging dependencies
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Install Windows FFmpeg dev libraries
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Build-time headers + MSVC import libs for the shared scrcpy decoder.
          # Pinned to FFmpeg 8.0.x so the import libs match the avcodec-62/avutil-60
          # runtime DLLs bundled from scrcpy. `flutter build windows` can't forward
          # -D defines, so hand the dirs to CMake via the environment
          # (see windows/runner/CMakeLists.txt).
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/8.0.1/ffmpeg-8.0.1-full_build-shared.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-shared'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $root = (Get-ChildItem -Path $dest -Directory | Select-Object -First 1).FullName -replace '\\','/'
          Add-Content -Path $env:GITHUB_ENV -Value "FFMPEG_INCLUDE_DIR=$root/include"
          Add-Content -Path $env:GITHUB_ENV -Value "FFMPEG_LIB_DIR=$root/lib"

      - name: Install Fastforge
        shell: bash
        run: dart pub global activate fastforge

      - name: Prepare bundled mobile tools
        shell: bash
        env:
          LIBIMOBILEDEVICE_MACOS_ARCHIVE: ${{ vars.LIBIMOBILEDEVICE_MACOS_ARCHIVE }}
          LIBIMOBILEDEVICE_LINUX_ARCHIVE: ${{ vars.LIBIMOBILEDEVICE_LINUX_ARCHIVE }}
          LIBIMOBILEDEVICE_WINDOWS_ARCHIVE: ${{ vars.LIBIMOBILEDEVICE_WINDOWS_ARCHIVE }}
          LIBIMOBILEDEVICE_MACOS_DIR: ${{ vars.LIBIMOBILEDEVICE_MACOS_DIR }}
          LIBIMOBILEDEVICE_LINUX_DIR: ${{ vars.LIBIMOBILEDEVICE_LINUX_DIR }}
          LIBIMOBILEDEVICE_WINDOWS_DIR: ${{ vars.LIBIMOBILEDEVICE_WINDOWS_DIR }}
        run: bash scripts/download_platform_tools.sh ${{ matrix.platform }}

      - name: Install dependencies
        run: flutter pub get

      - name: Package release artifacts
        shell: bash
        run: |
          dart pub global run fastforge:main package \
            --platform="${{ matrix.platform }}" \
            --targets="${{ matrix.targets }}" \
            --artifact-name='eagly-{{build_name}}-{{platform}}{{#is_installer}}-setup{{/is_installer}}{{#ext}}.{{ext}}{{/ext}}'

      - name: Create stable-named artifacts
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            find dist -name "*.dmg" | head -1 | xargs -I{} cp {} eagly-macos.dmg
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            find dist -name "*.deb" | head -1 | xargs -I{} cp {} eagly-linux.deb
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            find dist -name "*.exe" | head -1 | xargs -I{} cp {} eagly-windows-setup.exe
            find dist -name "*.msix" | head -1 | xargs -I{} cp {} eagly-windows.msix
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: eagly-${{ matrix.platform }}-${{ github.ref_name }}
          path: ${{ matrix.upload-path }}
          if-no-files-found: error

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.upload-path }}
            ${{ matrix.stable-glob }}

