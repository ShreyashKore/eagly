name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build the packages from any branch without tagging, so a change to
  # the build itself (toolchain, container image, bundled tools) can be proven
  # before it is attached to a release. Manual runs upload only workflow
  # artifacts — "Upload to release" below stays tag-only.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            targets: dmg
            upload-path: dist/*/*.dmg
            stable-glob: eagly-macos.*
          # Built inside an ubuntu:22.04 *container*, not on the runner image:
          # every native library in the bundle (libsentry.so + crashpad_handler,
          # which sentry_flutter compiles from source, the minimal FFmpeg, the
          # runner itself) inherits the build host's glibc, so building on
          # ubuntu-24.04 shipped a .deb that died on Ubuntu 22.04 with
          # "version `GLIBC_2.38' not found (required by lib/libsentry.so)".
          # The container fixes the baseline at glibc 2.35 independently of
          # which runner images GitHub currently offers — the ubuntu-22.04
          # runner label starts deprecating 2026-09-17 and is gone by
          # 2027-04-17, so pinning `runs-on` would only have bought months.
          # scripts/check_linux_glibc_baseline.sh enforces the result.
          # FFmpeg is not a factor: a minimal, glibc-only libavcodec/libavutil
          # is built and bundled inside the .deb (see build_linux_ffmpeg.sh +
          # make_config.yaml), so the package is otherwise distro-independent.
          - os: ubuntu-latest
            container: ubuntu:22.04
            platform: linux
            targets: deb
            upload-path: dist/*/*.deb
            stable-glob: eagly-linux.*
          - os: windows-latest
            platform: windows
            targets: exe,msix
            upload-path: |
              dist/*/*.exe
              dist/*/*.msix
            stable-glob: eagly-windows*

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Runs first: the ubuntu:22.04 image is bare, so actions/checkout would
      # fall back to a tarball download (no git) and flutter-action would have
      # no curl/jq/unzip to fetch the SDK with.
      #   git/curl/jq/unzip/xz-utils/zstd — checkout, flutter-action, actions/cache
      #   build-essential/make          — FFmpeg's configure + make
      #   clang/cmake/ninja/pkg-config/libgtk-3-dev/liblzma-dev — Flutter desktop
      #   libcurl4-openssl-dev          — sentry-native's Linux crash-upload transport
      #   nasm                          — x86 SIMD for the minimal FFmpeg
      #   patchelf                      — $ORIGIN RUNPATH on the bundled FFmpeg .so
      #   binutils                      — readelf, for the glibc baseline check
      #   openjdk-17-jdk                — sentry_flutter pulls package:jni, which
      #     registers a Linux FFI plugin whose CMakeLists does find_package(JNI);
      #     that needs libjvm *and* libjawt, so the -headless JDK is not enough.
      #     The GitHub runner images happen to ship a JDK — a bare container does
      #     not, so it has to be explicit here.
      #   dpkg-deb (in the base image)  — fastforge's deb maker
      # No libav*-dev: the scrcpy decoder links the bundled FFmpeg, not the
      # system one. No libstdc++-N-dev either — build-essential's g++-11 headers
      # keep the bundle's libstdc++ requirement at GLIBCXX_3.4.29, below what
      # Ubuntu 22.04's libstdc++6 provides.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git jq unzip xz-utils zstd \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev openjdk-17-jdk \
            libcurl4-openssl-dev nasm patchelf binutils
          # CMake's FindJNI locates the JDK through JAVA_HOME and does not fall
          # back to javac on PATH — the runner images export it, a container
          # does not, so derive it from the installed JDK.
          echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        shell: bash
        run: echo "FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          cache: true

      - name: Install macOS packaging dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p "$HOME/.local"
          npm install -g appdmg --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Windows packaging dependencies
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y

      # NOTE: Windows FFmpeg dev headers/import libs are downloaded by the
      # "Prepare bundled mobile tools" step below (download_platform_tools.sh
      # → download_windows_ffmpeg_dev), which forwards FFMPEG_INCLUDE_DIR /
      # FFMPEG_LIB_DIR to GITHUB_ENV for the build step.

      - name: Install Fastforge
        shell: bash
        run: dart pub global activate fastforge

      # The LIBIMOBILEDEVICE_*_ARCHIVE/_DIR env overrides are local-only escape
      # hatches for staging a custom bundle (see docs/CONTRIBUTING.md). Releases
      # intentionally build against the upstream bundle pinned in
      # download_platform_tools.sh, so the version is reviewable in git rather
      # than silently swappable from repo settings — same as SCRCPY_*.
      - name: Prepare bundled mobile tools
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/download_platform_tools.sh "$PLATFORM"

      - name: Install dependencies
        run: flutter pub get

      - name: Package release artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGETS: ${{ matrix.targets }}
        run: |
          dart pub global run fastforge:main package \
            --platform="$PLATFORM" \
            --targets="$TARGETS" \
            --artifact-name='eagly-{{build_name}}-{{platform}}{{#is_installer}}-setup{{/is_installer}}{{#ext}}.{{ext}}{{/ext}}'

      # Guards the promise the .deb makes in its libc6 dependency: nothing in
      # the package may reference a glibc/libstdc++ symbol newer than Ubuntu
      # 22.04 ships. Runs before the upload so a raised floor fails the release
      # instead of shipping a package that cannot start.
      - name: Verify Linux glibc baseline
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/check_linux_glibc_baseline.sh "$(find dist -name '*.deb' | head -1)"

      - name: Create stable-named artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = "macos" ]; then
            find dist -name "*.dmg" | head -1 | xargs -I{} cp {} eagly-macos.dmg
          elif [ "$PLATFORM" = "linux" ]; then
            find dist -name "*.deb" | head -1 | xargs -I{} cp {} eagly-linux.deb
          elif [ "$PLATFORM" = "windows" ]; then
            find dist -name "*.exe" | head -1 | xargs -I{} cp {} eagly-windows-setup.exe
            find dist -name "*.msix" | head -1 | xargs -I{} cp {} eagly-windows.msix
          fi

      # github.ref_name is the branch on a manual run, and artifact names cannot
      # contain a slash — fall back to the run id off a tag.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: eagly-${{ matrix.platform }}-${{ github.ref_type == 'tag' && github.ref_name || github.run_id }}
          path: ${{ matrix.upload-path }}
          if-no-files-found: error

      - name: Upload to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.upload-path }}
            ${{ matrix.stable-glob }}

