[package]
name = "rust_lib_eagly"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
idevice = { version = "=0.1.65", default-features = false, features = ["usbmuxd", "tcp", "pair", "syslog_relay", "installation_proxy"] }
plist = "1.8"
# `macros` for tokio::select!; FRB's own tokio brings only rt-multi-thread + sync.
tokio = { version = "1", features = ["macros"] }
tokio-util = { version = "0.7", default-features = false }

[features]
default = ["ring"]
aws-lc = ["idevice/aws-lc"]
ring = ["idevice/ring"]
openssl = ["idevice/openssl"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
